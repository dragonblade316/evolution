# WireViz source converted from image(1).png.
#
# Assumptions captured from the sketch:
# - 6S LiPo battery, RDQ Series 6S 1000 mAh 100C, about 22-25 V.
# - Main positive lead passes through a resettable breaker or fuse, then a precharge
#   connection, then into a power distribution bus.
# - Main battery/PDB conductors are 12 AWG.
# - ESC branch conductors are 20 AWG unless updated after current testing.
# - Each ESC positive feed has a 20 A fuse before the ESC.
# - The PDB internally ties all BAT+/ESC+/AUX+ terminals together and all
#   BAT-/ESC-/AUX- terminals together.
# - Motor 3 current limit was unclear in the drawing; it is recorded as 12 A?.

metadata:
  title: S1 Robot Power Harness
  source: hw/s1/image(1).png
  date: 2026-08-15

connectors:
  BATT_6S:
    type: Battery
    subtype: RDQ Series 6S LiPo, 1000 mAh, 100C
    pinlabels: [BAT+, BAT-]
    notes: Nominal 22.2 V, charged about 25.2 V.

  MAIN_PROTECTION:
    type: Fuse or resettable breaker
    subtype: Main battery protection
    pincount: 2
    notes: Sketch calls out "10A breaker or fuse" and "15A?". Select final rating after load test.

  PRECHARGE:
    type: Precharge connector
    pincount: 2

  PDB:
    type: Power distribution bus
    pinlabels:
      - BAT+
      - BAT-
      - ESC1+
      - ESC1-
      - ESC2+
      - ESC2-
      - ESC3+
      - ESC3-
      - ESC4+
      - ESC4-
      - ESC5+
      - ESC5-
      - AUX_SERVO+
      - AUX_SERVO-
      - AUX_PI+
      - AUX_PI-
    notes: Positive terminals are common internally; negative terminals are common internally.

  F_ESC1_20A:
    type: Fuse
    subtype: 20 A
    pincount: 2
  F_ESC2_20A:
    type: Fuse
    subtype: 20 A
    pincount: 2
  F_ESC3_20A:
    type: Fuse
    subtype: 20 A
    pincount: 2
  F_ESC4_20A:
    type: Fuse
    subtype: 20 A
    pincount: 2
  F_ESC5_20A:
    type: Fuse
    subtype: 20 A
    pincount: 2

  ESC1:
    type: ESC
    subtype: Motor 1 controller
    pinlabels: [VBAT+, VBAT-, PHASE_A, PHASE_B, PHASE_C, SIGNAL, GND]
    notes: Motor 1 current limit shown as 12 A.
  ESC2:
    type: ESC
    subtype: Motor 2 controller
    pinlabels: [VBAT+, VBAT-, PHASE_A, PHASE_B, PHASE_C, SIGNAL, GND]
    notes: Motor 2 current limit shown as 12 A.
  ESC3:
    type: ESC
    subtype: Motor 3 controller
    pinlabels: [VBAT+, VBAT-, PHASE_A, PHASE_B, PHASE_C, SIGNAL, GND]
    notes: Motor 3 current limit unclear; sketch says not sure about limits.
  ESC4:
    type: ESC
    subtype: Motor 4 controller
    pinlabels: [VBAT+, VBAT-, PHASE_A, PHASE_B, PHASE_C, SIGNAL, GND]
    notes: Motor 4 current limit shown as 8 A.
  ESC5:
    type: ESC
    subtype: Motor 5 controller
    pinlabels: [VBAT+, VBAT-, PHASE_A, PHASE_B, PHASE_C, SIGNAL, GND]
    notes: Motor 5 current limit shown as 15 A.

  M1:
    type: Brushless motor
    subtype: Motor 1
    pinlabels: [U, V, W]
  M2:
    type: Brushless motor
    subtype: Motor 2
    pinlabels: [U, V, W]
  M3:
    type: Brushless motor
    subtype: Motor 3
    pinlabels: [U, V, W]
  M4:
    type: Brushless motor
    subtype: Motor 4
    pinlabels: [U, V, W]
  M5:
    type: Brushless motor
    subtype: Motor 5
    pinlabels: [U, V, W]

  F_SERVO_10A:
    type: Fuse
    subtype: 10 A
    pincount: 2
  F_PI_10A:
    type: Fuse
    subtype: 10 A
    pincount: 2

  SERVO:
    type: Servo load
    pinlabels: [VIN+, VIN-]
    notes: Sketch shows 1-3 A stall.
  PI:
    type: Raspberry Pi load
    pinlabels: [VIN+, VIN-]

