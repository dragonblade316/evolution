[package]
name = "masterpiece"
version = "0.1.0"
edition = "2021"
default-run = "masterpiece-sim"

# The main executable of your application
[[bin]]
name = "masterpiece"
path = "src/main.rs"

[[bin]]
name = "masterpiece-sim"
path = "src/sim.rs"
required-features = ["sim-debug"]

[[bin]]
name = "masterpiece-logreader"
path = "src/logreader.rs"
required-features = ["logreader"]

[[bin]]
name = "masterpiece-resim"
path = "src/resim.rs"
required-features = ["sim-debug"]

[[bin]]
name = "masterpiece-twin"
path = "src/twin.rs"
required-features = ["sim-debug"]

[[bin]]
name = "masterpiece-evoviz-logreader"
path = "src/evoviz_logreader.rs"
required-features = ["evoviz-logreader"]

[features]
default = []
logreader = ["dep:cu29-export"]
evoviz-logreader = ["logreader", "dep:evoviz_test"]
sim-debug = ["logreader", "cu29/reflect", "cu29/remote-debug", "dep:cuviz", "dep:ctrlc"]

[dependencies]
cu29 = { workspace = true, features = ["reflect"] }
cu29-export = { workspace = true, optional = true }
serde = { workspace = true }
rapier2d = { workspace = true }
glam = { workspace = true }
common = { workspace = true }
cu-spatial-payloads = { workspace = true }
bincode.workspace = true

moteus_bridge = { workspace = true }
Joy = { workspace = true }
oakd_lite_source = { workspace = true }
BNOSource = { workspace = true }
Prototyping = { workspace = true }
drive_utils = { workspace = true }
diffdrive = { workspace = true }
field_oriented_diff_drive = { workspace = true }
iekflocalizer = { workspace = true }
moteus_tasks = { workspace = true }
allience_spesific_tasks = { workspace = true }
sotm_rt = { workspace = true }
turret_tasks = { workspace = true }
evoviz = { workspace = true }
rpsinks = { workspace = true }
cu-apriltag = { workspace = true }
cu-logmon = { workspace = true }
evosim = { workspace = true }
evods = { workspace = true }
evoviz_test = { path = "../../external/evoviz_test", optional = true }
cuviz = { path = "../../external/cuviz-test/cuviz", features = ["logstream"], optional = true }
ctrlc = { version = "3.5.2", optional = true }
rerun = { workspace = true }
cu-zenoh-bridge = { workspace = true }
