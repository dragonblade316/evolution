[package]
name = "proto"
version = "0.1.0"
edition = "2021"
default-run = "proto"

[[bin]]
name = "proto"
path = "src/main.rs"

[[bin]]
name = "proto-logreader"
path = "src/logreader.rs"
required-features = ["logreader"]

[features]
default = []
logreader = ["dep:cu29-export"]

[dependencies]
cu29 = { workspace = true }
cu29-export = { workspace = true, optional = true }
serde = { workspace = true }
common = { workspace = true }
bincode = { workspace = true }

moteus_bridge = { workspace = true }
Joy = { workspace = true }
Prototyping = { workspace = true }
