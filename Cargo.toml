[workspace]
members = [
    "apps/cu_example_app",
    "apps/masterpiece",
    "components/bridges/moteus_bridge", "components/tasks/diffdrive",
    "components/payloads/common", "components/sources/oakd_lite_source", "components/tasks/field_oriented_diff_drive", "components/tasks/iekflocalizer",     "components/tasks/accel_limiter",
    "components/tasks/diffdrive_odometry"
, "components/tasks/moteus_tasks", "components/tasks/sotm_rt", "external/evodo_dioxus"]
resolver = "2"

[workspace.dependencies]
cu29 = "1.0.0"
cu-spatial-payloads = "1.0.0"
cu-sensor-payloads = "1.0.0"
cu-apriltag = "1.0.0"
cu29-export = { version = "*"  }
serde = { version = "*", features = ["derive"] }
nalgebra = "0.34.2"
rerun = "0.33.1"
ordered-float = "5.3.0"
pid = "4.0.0"
kalman_filters = { version = "1.0.1", features = ["nalgebra"] }
kfilter = "0.5.1"
sophus = "0.15.0"
moteus = "0.5.3"
rapier2d = "0.33.0"
glam = "0.33.2"
#internal deps
common = { path = "./components/payloads/common/" }

moteus_bridge = { path = "./components/bridges/moteus_bridge/" }
oakd_lite_source = { path = "./components/sources/oakd_lite_source/" }
accel_limiter = { path = "./components/tasks/accel_limiter/" }
diffdrive = { path = "./components/tasks/diffdrive/" }
diffdrive_odometry = { path = "./components/tasks/diffdrive_odometry/" }
field_oriented_diff_drive = { path = "./components/tasks/field_oriented_diff_drive/" }
iekflocalizer = { path = "./components/tasks/iekflocalizer/" }
moteus_tasks = { path = "./components/tasks/moteus_tasks/" }
