[workspace]
members = [
    "apps/cu_example_app",
    "apps/masterpiece",
    "apps/proto",
    "components/bridges/moteus_bridge", "components/tasks/diffdrive",
    "components/payloads/common", "components/sources/oakd_lite_source", "components/tasks/field_oriented_diff_drive", "components/tasks/iekflocalizer",     "components/tasks/drive_utils",
    "components/tasks/moteus_tasks", "components/tasks/sotm_rt", "external/evosim", "components/sources/Joy", "components/tasks/Prototyping", "components/tasks/turret_tasks", "components/sinks/evoviz", "components/sinks/rpsinks", "evods", "components/sources/BNOSource", "external/evograph", "components/tasks/allience_spesific_tasks", "components/tasks/apriltag_tasks", "external/evoviz_test", "external/cuviz-test/cuviz", "external/cuviz-test/cuviz-macros", "external/cuviz-test/cuviz-core"]
resolver = "2"

[profile.dev]
opt-level = 2

[workspace.dependencies]
# cu29 = { version = "1.1.0", features = ["reflect"] }
cu29 = "1.2.1"
cu-spatial-payloads = "1.2.1"
cu-sensor-payloads = "1.2.1"
cu-apriltag = "1.2.1"
cu-v4l = "1.2.1"
cu-logmon = "1.2.1"
cu29-export = { version = "1.2.1" }
cu-zenoh-bridge = "1.2.1"
serde = { version = "*", features = ["derive"] }
nalgebra = "0.34.2"
rerun = "0.33.1"
ordered-float = "5.3.0"
pid = "4.0.0"
kalman_filters = { version = "1.0.1", features = ["nalgebra"] }
kfilter = "0.5.1"
sophus = "0.15.0"
moteus = "0.5.3"
rapier2d = "0.33.0"
glam = "0.33.2"
bincode = { version = "2.0", package = "cu-bincode", default-features = false, features = ["derive", "alloc"] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
zenoh = { version = "1.9.0", default-features = false, features = ["transport_tcp", "transport_udp", "transport_unixsock-stream"] }
gilrs = "0.11"
serde_json = "1"
dioxus = { version = "=0.7.9", features = ["desktop"] }
#internal deps
common = { path = "./components/payloads/common/" }

moteus_bridge = { path = "./components/bridges/moteus_bridge/" }
oakd_lite_source = { path = "./components/sources/oakd_lite_source/" }
BNOSource = { path = "./components/sources/BNOSource/" }
drive_utils = { path = "./components/tasks/drive_utils/" }
diffdrive = { path = "./components/tasks/diffdrive/" }
field_oriented_diff_drive = { path = "./components/tasks/field_oriented_diff_drive/" }
iekflocalizer = { path = "./components/tasks/iekflocalizer/" }
moteus_tasks = { path = "./components/tasks/moteus_tasks/" }
allience_spesific_tasks = { path = "./components/tasks/allience_spesific_tasks/" }
apriltag_tasks = { path = "./components/tasks/apriltag_tasks/" }
sotm_rt = { path = "./components/tasks/sotm_rt/" }
turret_tasks = { path = "./components/tasks/turret_tasks/" }
evoviz = { path = "./components/sinks/evoviz/" }
rpsinks = { path = "./components/sinks/rpsinks/" }
evosim = { path = "./external/evosim/" }
evods = { path = "./evods/" }
Joy = { path = "./components/sources/Joy/" }
Prototyping = { path = "./components/tasks/Prototyping/" }
